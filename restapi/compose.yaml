services:
    api:
        build: .
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: 3000
            DATABASE_PATH: /app/data/obstudy-api.db
        ports:
            - "127.0.0.1:3000:3000"
        volumes:
            - database:/app/data
volumes:
    database:
